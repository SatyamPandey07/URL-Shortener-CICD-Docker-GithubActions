# .github/workflows/codeql.yml
#
# Static Application Security Testing (SAST) — Scans the python codebase
# using GitHub CodeQL to identify vulnerabilities, injection issues, and bugs
# before they are merged. Runs on PRs, pushes, and on a weekly schedule.

name: "CodeQL Analysis"

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  schedule:
    # Run weekly on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'

concurrency:
  group: codeql-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Code base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      # Python is an interpreted language; no custom compilation steps needed.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
